name: Template.GitOps.Dispatch

on:
  workflow_call:
    inputs:
      infra_event:
        required: true
        type: string
      image:
        required: true
        type: string
      environment:
        required: true
        type: string
        
    secrets:
      GITOPS_REPO_PAT:
        required: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    
    env:
      GITOPS_REPOSITORY: nixonjoshua98/nixon-gitops
      EVENT_TYPE: ${{ inputs.infra_event }}
      IMAGE: ${{ inputs.image }}
      ENVIRONMENT: ${{ inputs. environment}}
      GITOPS_REPO_PAT: ${{ secrets.GITOPS_REPO_PAT }}
      
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.GITOPS_REPO_PAT }}
          repository: ${{ env.GITOPS_REPOSITORY }}
          event-type: ${{ env.EVENT_TYPE }}
          client-payload: |
            {
              "image": "${{ env.IMAGE }}",
              "environment": "${{ env.ENVIRONMENT }}"
            }
