name: Template.Deployables.Build

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ build, name, context, dockerfilePath, proposedImage }]'
        required: true
        type: string

      has-matrix-json:
        required: true
        type: boolean

      sparse-checkout:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.buildable.name }}
    if: ${{ inputs.has-matrix-json == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildable: ${{ fromJSON(inputs.matrix-json) }}
    steps:

      - id: login
        name: Login to Azure
        uses: nixonjoshua98/shared-workflows/.github/actions/azure-acr-login@feature/speed-improvements
        background: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUB_ID }}
          registry: ${{ vars.AZURE_REGISTRY }}

      - parallel:
        - uses: actions/checkout@v7
          with:
            sparse-checkout: ${{ inputs.sparse-checkout }}
        - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.buildable.name }}
        uses: docker/build-push-action@v7
        with:
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ matrix.buildable.context }}
          file: ${{ matrix.buildable.dockerfilePath }}
          tags: ${{ matrix.buildable.proposedImage }}

      - name: Login to Azure
        wait: login

      - name: Push ${{ matrix.buildable.name }}
        shell: bash
        run: docker push '${{ matrix.buildable.proposedImage }}'