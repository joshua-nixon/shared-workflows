name: Template.Deployables.Run

on:
  workflow_call:
    inputs:
      environment-json:
        type: string
        default: '[]'

      buildable-json:
        type: string
        required: true

      sparse-checkout:
        type: string
        default: ''

      azure-client-id:
        required: true
        type: string

      azure-tenant-id:
        required: true
        type: string

      azure-subscription-id:
        required: true
        type: string

      azure-registry:
        required: true
        type: string

      gitops-repository:
        required: true
        type: string

      deploy-action:
        type: string
        default: ''

    secrets:
      GITOPS_REPO_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    uses: ./.github/workflows/Template.Deployables.Setup.yaml
    with:
      buildable-json: ${{ inputs.buildable-json }}
      environment-json: ${{ inputs.environment-json }}
      azure-registry: ${{ inputs.azure-registry }}

  test:
    needs: 
      - setup
    uses: ./.github/workflows/Template.Deployables.Tests.yaml
    with:
      sparse-checkout: ${{ inputs.sparse-checkout }}
      matrix-json: ${{ needs.setup.outputs.test-projects-json }}
      should-run: ${{ needs.setup.outputs.has-any-testable == 'true' }}

  build:
    needs:
      - setup
    uses: ./.github/workflows/Template.Deployables.Build.yaml
    with:
      sparse-checkout: ${{ inputs.sparse-checkout }}
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      should-run: ${{ needs.setup.outputs.has-any-buildable == 'true' }}
      azure-client-id: ${{ inputs.azure-client-id }}
      azure-tenant-id: ${{ inputs.azure-tenant-id }}
      azure-subscription-id: ${{ inputs.azure-subscription-id }}
      azure-registry: ${{ inputs.azure-registry }}

  scan:
    needs:
      - setup
      - build
    uses: ./.github/workflows/Template.Deployables.Scan.yaml
    with:
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      should-run: ${{ needs.setup.outputs.has-any-buildable == 'true' }}
      azure-client-id: ${{ inputs.azure-client-id }}
      azure-tenant-id: ${{ inputs.azure-tenant-id }}
      azure-subscription-id: ${{ inputs.azure-subscription-id }}
      azure-registry: ${{ inputs.azure-registry }}

  deploy:
    needs:
      - setup
      - test
      - build
      - scan
    if: |
      !cancelled() && 
      !failure() && 
      !contains(needs.*.result, 'failure') && 
      !contains(needs.*.result, 'cancelled') &&  
      needs.setup.outputs.has-any-deployable == 'true'
    uses: ./.github/workflows/Template.Deployables.Deploy.yaml
    with:
      deploy-action: ${{ inputs.deploy-action }}
      gitops-repository: ${{ inputs.gitops-repository }}
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      environment-json: ${{ needs.setup.outputs.environment-json }}
    secrets:
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}