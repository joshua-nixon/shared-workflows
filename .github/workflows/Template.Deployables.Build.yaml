name: Template.Deployables.Build

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ name, eventName, context, dockerfilePath, imageName }]'
        required: true
        type: string

      should-run:
        required: true
        type: boolean

      sparse-checkout:
        type: string
        default: ''

      azure-client-id:
        required: true
        type: string

      azure-tenant-id:
        required: true
        type: string

      azure-subscription-id:
        required: true
        type: string

      azure-registry:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project.name }}
    if: ${{ inputs.should-run == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:

      - parallel:
        - uses: actions/checkout@v7
          with:
            sparse-checkout: ${{ inputs.sparse-checkout }}

        - uses: docker/setup-buildx-action@v4

        - name: Login to Azure
          uses: nixonjoshua98/shared-workflows/.github/actions/azure-acr-login@v1.6
          with:
            client-id: ${{ inputs.azure-client-id }}
            tenant-id: ${{ inputs.azure-tenant-id }}
            subscription-id: ${{ inputs.azure-subscription-id }}
            registry: ${{ inputs.azure-registry }}

      - name: Build and push ${{ matrix.project.name }}
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ matrix.project.context }}
          file: ${{ matrix.project.dockerfilePath }}
          tags: ${{ matrix.project.imageName }}