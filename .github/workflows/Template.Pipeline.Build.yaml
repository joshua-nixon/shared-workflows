name: Template.Pipeline.Build

on:
  workflow_call:
    inputs:
      matrix-json:
        type: string
        required: true

      should-run:
        type: boolean
        required: true

      sparse-checkout:
        type: string
        default: ''

      azure-client-id:
        required: true
        type: string

      azure-tenant-id:
        type: string
        required: true

      azure-subscription-id:
        type: string
        required: true

      azure-registry:
        type: string
        required: true

      enable-trivy:
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project.name }}
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:

      - parallel:
        - uses: actions/checkout@v7
          with:
            sparse-checkout: ${{ inputs.sparse-checkout }}

        - uses: docker/setup-buildx-action@v4

        - name: Login to Azure
          uses: nixonjoshua98/shared-workflows/.github/actions/azure-acr-login@v1.6
          with:
            client-id: ${{ inputs.azure-client-id }}
            tenant-id: ${{ inputs.azure-tenant-id }}
            subscription-id: ${{ inputs.azure-subscription-id }}
            registry: ${{ inputs.azure-registry }}

      - name: Build ${{ matrix.project.name }}
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ matrix.project.context }}
          file: ${{ matrix.project.dockerfilePath }}
          tags: ${{ matrix.project.imageName }}

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        if: inputs.enable-trivy
        with:
          image-ref: ${{ matrix.project.imageName }}
          scanners: vuln
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publish Trivy Summary
        if: always() && inputs.enable-trivy
        run: |
          if [ -s trivy-report.txt ]; then
            echo "<h2>Trivy Scan Results</h2>" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi