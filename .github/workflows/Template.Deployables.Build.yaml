name: Template.Deployables.Build

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ build, name, context, dockerfilePath, proposedImage }]'
        required: true
        type: string

      has-matrix-json:
        required: true
        type: boolean

      sparse-checkout:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project.name }}
    if: ${{ inputs.has-matrix-json == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:

      - name: Checkout required actions
        uses: actions/checkout@v7
        with:
          repository: nixonjoshua98/shared-workflows
          ref: feature/speed-improvements
          sparse-checkout: |
            .github/actions/azure-acr-login

      - name: Verify shared action is available
        shell: pwsh
        run: |
          Write-Host "Checking shared action path..."
          Test-Path "_shared/.github/actions/azure-acr-login/action.yml" | Write-Host
          Get-ChildItem "_shared/.github/actions/azure-acr-login" | Format-Table -AutoSize

      - id: login
        name: Login to Azure
        uses: ./_shared/.github/actions/azure-acr-login
        background: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUB_ID }}
          registry: ${{ vars.AZURE_REGISTRY }}

      - parallel:
        - uses: actions/checkout@v7
          with:
            sparse-checkout: ${{ inputs.sparse-checkout }}
        - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.project.name }}
        uses: docker/build-push-action@v7
        with:
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ matrix.project.context }}
          file: ${{ matrix.project.dockerfilePath }}
          tags: ${{ matrix.project.proposedImage }}

      - name: Login to Azure
        wait: login

      - name: Push ${{ matrix.project.name }}
        shell: bash
        run: docker push '${{ matrix.project.proposedImage }}'