name: Template.Deployables.Run

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

      deployables-json:
        type: string
        required: true

      sparse-checkout:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    uses: ./.github/workflows/Template.Deployables.Setup.yaml
    with:
      deployables-json: ${{ inputs.deployables-json }}

  test:
    needs: 
      - setup
    uses: ./.github/workflows/Template.Deployables.Tests.yaml
    with:
      sparse-checkout: ${{ inputs.sparse-checkout }}
      matrix-json: ${{ needs.setup.outputs.test-projects-json }}
      has-matrix-json: ${{ needs.setup.outputs.has-test-projects-json == 'true' }}

  build:
    needs:
      - setup
    uses: ./.github/workflows/Template.Deployables.Build.yaml
    with:
      sparse-checkout: ${{ inputs.sparse-checkout }}
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      has-matrix-json: ${{ needs.setup.outputs.has-buildable-json == 'true' }}

  scan:
    needs:
      - setup
      - build
    uses: ./.github/workflows/Template.Deployables.Scan.yaml
    with:
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      has-matrix-json: ${{ needs.setup.outputs.has-buildable-json == 'true' }}

  dispatch:
    needs:
      - setup
      - test
      - build
      - scan
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/Template.Deployables.Dispatch.yaml
    with:
      matrix-json: ${{ needs.setup.outputs.buildable-json }}
      has-matrix-json: ${{ needs.setup.outputs.has-buildable-json == 'true' }}
      environment: ${{ inputs.environment }}
    secrets: inherit