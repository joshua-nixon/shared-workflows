name: Azure ACR Login

description: Authenticate to Azure with OIDC and log in to Azure Container Registry

runs:
  using: composite
  steps:
    - name: Login to Azure with OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUB_ID }}
        registry: ${{ vars.AZURE_REGISTRY }}

    - name: Login to Azure Container Registry
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ vars.AZURE_REGISTRY }}
      run: az acr login --name "${IMAGE_REGISTRY%%.*}"
