name: Template.Deployables.Scan

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ name, proposedImage }]'
        required: true
        type: string
      has-matrix-json:
        required: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.deployable.name }}
    if: ${{ inputs.has-matrix-json == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deployable: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - name: Azure Container Registry Login
        uses: nixonjoshua98/shared-workflows/.github/actions/azure-acr-login@feature/speed-improvements
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUB_ID }}
          registry: ${{ vars.AZURE_REGISTRY }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.deployable.proposedImage }}
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
