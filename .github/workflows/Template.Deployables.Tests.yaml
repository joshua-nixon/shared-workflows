name: Template.Deployables.Tests

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ name, path }]'
        required: true
        type: string

      has-matrix-json:
        required: true
        type: string

      sparse-checkout:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.project.name }}
    if: ${{ inputs.has-matrix-json == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: Test ${{ matrix.project.name }}
        shell: bash
        run: dotnet test '${{ matrix.project.path }}'