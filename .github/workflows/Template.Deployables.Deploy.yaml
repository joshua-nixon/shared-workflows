name: Template.Deployables.Deploy

on:
  workflow_call:
    inputs:

      # [{ name, proposedImage }]
      matrix-json:
        type: string
        required: true

      # [ { name } ]
      environment-json:
        type: string
        default: '[]'

      gitops-repository:
        type: string
        required: true

      deploy-action:
        type: string
        required: true

    secrets:
      GITOPS_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Deploy ${{ matrix.deployable.name }} ( ${{ matrix.environment.name }} )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deployable: ${{ fromJSON(inputs.matrix-json) }}
        environment: ${{ fromJSON(inputs.environment-json) }}
    steps:
      - name: Create client payload
        id: client-payload
        shell: pwsh
        env:
          IMAGE: ${{ matrix.deployable.proposedImage }}
          ENVIRONMENT: ${{ matrix.environment.name }}
          DEPLOY_ACTION: ${{ inputs.deploy-action }}
        run: |
          $payload = @{
            image         = $env:IMAGE
            environment   = $env:ENVIRONMENT
            deployAction  = $env:DEPLOY_ACTION.ToUpperInvariant()
          } | ConvertTo-Json -Compress

          "client-payload=$payload" >> $env:GITHUB_OUTPUT

      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          repository: ${{ inputs.gitops-repository }}
          event-type: ${{ matrix.deployable.eventName }}
          client-payload: ${{ steps.client-payload.outputs.client-payload }}