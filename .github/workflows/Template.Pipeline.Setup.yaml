name: Template.Pipeline.Setup

on:
  workflow_call:
    inputs:
      buildable-json:
        required: true
        type: string

      environment-json:
        required: true
        type: string

      azure-registry:
        required: true
        type: string

    outputs:
      test-projects-json:
        value: ${{ jobs.setup.outputs.test-projects-json }}

      environment-json:
        value: ${{ jobs.setup.outputs.environment-json }}

      buildable-json:
        value: ${{ jobs.setup.outputs.buildable-json }}

      has-any-testable:
        value: ${{ jobs.setup.outputs.has-any-testable }}

      has-any-buildable:
        value: ${{ jobs.setup.outputs.has-any-buildable }}

      has-any-deployable:
        value: ${{ jobs.setup.outputs.has-any-deployable }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      test-projects-json: ${{ steps.metadata.outputs.test-projects-json }}
      has-any-testable: ${{ steps.metadata.outputs.has-any-testable }}
      environment-json: ${{ steps.metadata.outputs.environment-json }}
      buildable-json: ${{ steps.metadata.outputs.buildable-json }}
      has-any-buildable: ${{ steps.metadata.outputs.has-any-buildable }}
      has-any-deployable: ${{ steps.metadata.outputs.has-any-deployable }}
    steps:
      - name: Checkout .github
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github

      - name: Checkout required resources
        uses: actions/checkout@v7
        with:
          repository: nixonjoshua98/shared-workflows
          ref: v1.8
          sparse-checkout: |
            .github/scripts/CreatePipelineData.ps1

      - name: Get files changed
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          json: true
          
      - name: Create json data
        id: metadata
        shell: pwsh
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          AZURE_REGISTRY: ${{ inputs.azure-registry }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BUILDABLE_JSON: ${{ inputs.buildable-json }}
          ENVIRONMENTS_JSON: ${{ inputs.environment-json }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_changed_files || '[]' }}
        run: |
          function Write-Env($name, $value) {
            "$name=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $metadataJson = & .github/scripts/CreatePipelineData.ps1 `
            -BuildableJson      $env:BUILDABLE_JSON `
            -ChangedFilesJson   $env:CHANGED_FILES_JSON `
            -GitHubSHA          $env:GITHUB_SHA_VALUE `
            -GitHubRefName      $env:GITHUB_REF_NAME `
            -ContainerRegistry  $env:AZURE_REGISTRY `
            -GitHubEventName    $env:GITHUB_EVENT_NAME `
            -EnvironmentsJson   $env:ENVIRONMENTS_JSON

          $metadata = $metadataJson | ConvertFrom-Json

          $buildableJson    = ConvertTo-Json -InputObject ([object[]]@($metadata.buildable))    -Compress
          $environmentsJson = ConvertTo-Json -InputObject ([object[]]@($metadata.environments)) -Compress
          $testProjectsJson = ConvertTo-Json -InputObject ([object[]]@($metadata.testProjects)) -Compress

          Write-Env "buildable-json"      $buildableJson
          Write-Env "environment-json"    $environmentsJson
          Write-Env "test-projects-json"  $testProjectsJson

          Write-Env "has-any-buildable"  $metadata.hasAnyBuildable.ToString().ToLower()
          Write-Env "has-any-testable"   $metadata.hasAnyTestable.ToString().ToLower()
          Write-Env "has-any-deployable" $metadata.hasAnyDeployable.ToString().ToLower()

          $metadata | ConvertTo-Json -Depth 10  # Write to the host