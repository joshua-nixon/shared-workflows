name: Template.Pipeline.Deploy

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true

      environment:
        type: string
        required: true

      gitops-repository:
        type: string
        required: true

      event-type:
        type: string
        required: true

    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  repository-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ inputs.gitops-repository }}
          event-type: ${{ inputs.event-type }}
          client-payload: |
            {
              "image": "${{ inputs.image }}",
              "environment": "${{ inputs.environment }}"
            }