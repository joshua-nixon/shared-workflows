name: Template.Deployables.Setup

on:
  workflow_call:
    inputs:
      deployables-json:
        description: '[{ key, build }]'
        required: true
        type: string
    outputs:
      test-projects-json:
        value: ${{ jobs.setup.outputs.test-projects-json }}
      has-test-projects-json:
        value: ${{ jobs.setup.outputs.has-test-projects-json }}
      buildable-json:
        value: ${{ jobs.setup.outputs.buildable-json }}
      has-buildable-json:
        value: ${{ jobs.setup.outputs.has-buildable-json }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      test-projects-json: ${{ steps.metadata.outputs.test-projects-json }}
      has-test-projects-json: ${{ steps.metadata.outputs.has-test-projects-json }}
      buildable-json: ${{ steps.metadata.outputs.buildable-json }}
      has-buildable-json: ${{ steps.metadata.outputs.has-buildable-json }}
    steps:
      - name: Checkout .github
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github

      - name: Checkout required resources
        uses: actions/checkout@v7
        with:
          repository: nixonjoshua98/shared-workflows
          ref: v1.4
          path: _shared
          sparse-checkout: |
            .github/scripts/CreateDeployableMeta.ps1

      - name: Get files changed
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          json: true
          
      - name: Create deployable metadata
        id: metadata
        shell: pwsh
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
          AZURE_REGISTRY: ${{ vars.AZURE_REGISTRY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DEPLOYABLES_JSON: ${{ inputs.deployables-json }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          function Write-Env($name, $value) {
            "$name=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $metadataJson = & _shared/.github/scripts/CreateDeployableMeta.ps1 `
            -DeployablesJson    $env:DEPLOYABLES_JSON `
            -ChangedFilesJson   $env:CHANGED_FILES_JSON `
            -GitHubSHA          $env:GITHUB_SHA_VALUE `
            -GitHubRefName      $env:GITHUB_REF_NAME `
            -ContainerRegistry  $env:AZURE_REGISTRY `
            -GitHubEventName    $env:GITHUB_EVENT_NAME

          $metadata = @( $metadataJson | ConvertFrom-Json )

          $buildableMetadata  = @( $metadata | Where-Object { $_.build } )
          $buildableJson      = ConvertTo-Json -InputObject ([object[]]$buildableMetadata) -Compress
          $hasBuildable       = ($buildableMetadata.Count -gt 0).ToString().ToLower()

          Write-Env "buildable-json"      $buildableJson
          Write-Env "has-buildable-json"  $hasBuildable

          $testMetadata       = @( $metadata | Where-Object { $_.runTests } )
          $testProjectMatrix  = @( $testMetadata | ForEach-Object { $_.testProjects } | Sort-Object -Property path -Unique )
          $testProjectsJson   = ConvertTo-Json -InputObject ([object[]]$testProjectMatrix) -Compress
          $hasTestProjects    = ($testProjectMatrix.Count -gt 0).ToString().ToLower()

          Write-Env "test-projects-json"      $testProjectsJson
          Write-Env "has-test-projects-json"  $hasTestProjects