name: Template.Pipeline.Tests

on:
  workflow_call:
    inputs:
      matrix-json:
        type: string
        required: true

      should-run:
        type: boolean
        required: true

      sparse-checkout:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.project.name }}
    if: ${{ inputs.should-run == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.sparse-checkout }}

      - name: Test ${{ matrix.project.name }}
        shell: bash
        run: dotnet test '${{ matrix.project.path }}'