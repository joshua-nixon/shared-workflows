name: Template.Deployables.Dispatch

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ name, proposedImage }]'
        required: true
        type: string
      has-matrix-json:
        required: true
        type: boolean
      environment:
        required: true
        type: string

    secrets:
      GITOPS_REPO_PAT:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: ${{ matrix.deployable.name }}
    if: ${{ inputs.has-matrix-json == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deployable: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - name: Dispatch image change
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_REPO_PAT }}
          repository: nixonjoshua98/nixon-gitops
          event-type: ${{ matrix.deployable.eventName }}
          client-payload: >-
            { "image": "${{ matrix.deployable.proposedImage }}","environment": "${{ inputs.environment }}" }