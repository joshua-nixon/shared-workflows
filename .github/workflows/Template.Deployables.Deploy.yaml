name: Template.Deployables.Deploy

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ name, proposedImage }]'
        required: true
        type: string

      environments-json:
        description: '[{ name }]'
        type: string
        default: '[]'

      gitops-repository:
        type: string
        required: true

    secrets:
      GITOPS_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Deploy ${{ matrix.deployable.name }} ( ${{ matrix.environment.name }} )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deployable: ${{ fromJSON(inputs.matrix-json) }}
        environment: ${{ fromJSON(inputs.environments-json) }}
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          repository: ${{ inputs.gitops-repository }}
          event-type: ${{ matrix.deployable.eventName }}
          client-payload: >-
            {
              "image": "${{ matrix.deployable.proposedImage }}",
              "environment": "${{ matrix.environment.name }}"
            }