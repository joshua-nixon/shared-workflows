name: Template.Deployables.Build

on:
  workflow_call:
    inputs:
      matrix-json:
        description: '[{ build, name, context, dockerfilePath, proposedImage }]'
        required: true
        type: string

      has-matrix-json:
        required: true
        type: boolean

      sparse-checkout:
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project.name }}
    if: ${{ inputs.has-matrix-json == true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.matrix-json) }}
    steps:

      - parallel:
        - uses: actions/checkout@v7
          with:
            sparse-checkout: ${{ inputs.sparse-checkout }}

        - uses: docker/setup-buildx-action@v4

        - name: Login to Azure
          uses: nixonjoshua98/shared-workflows/.github/actions/azure-acr-login@v1.5
          with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUB_ID }}
            registry: ${{ vars.AZURE_REGISTRY }}

      - name: Build and push ${{ matrix.project.name }}
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ matrix.project.context }}
          file: ${{ matrix.project.dockerfilePath }}
          tags: ${{ matrix.project.proposedImage }}