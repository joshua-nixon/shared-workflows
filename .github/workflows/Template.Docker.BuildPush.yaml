name: Template.Docker.BuildPush

on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}

    inputs:
      image-repository:
        required: true
        type: string

      image-registry:
        required: true
        type: string

      dockerfile-path:
        required: true
        type: string

      build-context:
        required: true
        type: string
        
      azure-client-id:
        required: true
        type: string

      azure-tenant-id:
        required: true
        type: string

      azure-subscription-id:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_REGISTRY: ${{ inputs.image-registry }}
      IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
      AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
      AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
      DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
      BUILD_CONTEXT: ${{ inputs.build-context }}

    outputs:
      image: ${{ steps.create_tag.outputs.image }}

    steps:
      - parallel:

        - uses: actions/checkout@v6

        - uses: docker/setup-buildx-action@v4

        - id: create_tag
          name: Create tag
          shell: bash
          run: |
            IMAGE_TAG="sha-${GITHUB_SHA::12}"
            IMAGE="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            echo "image=${IMAGE}" >> $GITHUB_OUTPUT

        - name: Login to Azure with OIDC
          uses: azure/login@v3
          with:
            client-id: ${{ env.AZURE_CLIENT_ID }}
            tenant-id: ${{ env.AZURE_TENANT_ID }}
            subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${IMAGE_REGISTRY%%.*}"

      - uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          tags: ${{ steps.create_tag.outputs.image }}